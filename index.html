<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASSWORD GLITCH</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{border:2px solid #ff00ff;padding:30px;border-radius:15px;box-shadow:0 0 20px #ff00ff,0 0 40px #00ffff;width:90%;max-width:400px;text-align:center}
h1{color:#00ffff;text-shadow:0 0 10px #ff00ff;font-size:1.8em}
#pass{background:#111;border:1px solid #00ffff;color:#00ffff;padding:15px;font-size:1.3em;width:100%;margin:20px 0;letter-spacing:2px;text-align:center;box-shadow:0 0 10px #00ffff inset}
.btn{width:100%;padding:15px;background:linear-gradient(45deg,#ff00ff,#00ffff);border:none;color:#000;font-weight:bold;font-size:1.1em;cursor:pointer;border-radius:8px;margin:5px 0}
.btn:active{transform:scale(0.98)}
input[type=range]{width:100%;margin:15px 0}
label{color:#ff00ff}
</style>
</head>
<body>
<div class="box">
<h1>GLITCH PASS</h1>
<input id="pass" readonly placeholder="GENERANDO...">
<label>Longitud: <span id="len">16</span></label>
<input type="range" id="length" min="8" max="32" value="16" oninput="document.getElementById('len').innerText=this.value">
<button class="btn" onclick="generate()">GENERAR</button>
<button class="btn" style="background:#111;color:#00ffff;border:1px solid #00ffff" onclick="copy()">COPIAR</button>
<p style="font-size:0.8em;color:#666;margin-top:15px">@esenubes991-glitch</p>
</div>
<script>
function generate(){
 const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+{}[]";
 let l=document.getElementById('length').value;let p="";
 for(let i=0;i<l;i++)p+=chars[Math.floor(Math.random()*chars.length)];
 document.getElementById('pass').value=p;
}
function copy(){
 let p=document.getElementById('pass');p.select();document.execCommand('copy');alert('¡Copiada! 🔥');
}
generate();
</script>
</body>
</html>
